name: hybrid-codex

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Official openai/codex release tag, for example rust-v0.147.0
        required: false
        type: string
      release_tag:
        description: Optional hybrid release tag, for example hybrid-v0.147.0-p1
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hybrid-codex-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Patch tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
      - name: Verify patch
        run: ../scripts/hybrid-codex/test-patch.sh

  build:
    name: Build macOS arm64 bundle
    needs: test
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "off"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: aarch64-apple-darwin
      - name: Cache Cargo downloads
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: hybrid-codex-cargo-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}
      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: aarch64-apple-darwin
      - name: Validate release inputs
        if: ${{ inputs.release_tag != '' }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          [[ "$UPSTREAM_TAG" == "rust-v${cargo_version}" ]]
          [[ "$RELEASE_TAG" =~ ^hybrid-v${cargo_version}-p[1-9][0-9]*$ ]]
      - name: Build
        run: cargo build --release --target aarch64-apple-darwin --bin codex --bin codex-code-mode-host
      - name: Package
        env:
          RELEASE_TAG: ${{ inputs.release_tag || 'snapshot' }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag || 'unknown' }}
        shell: bash
        run: |
          set -euo pipefail
          package_dir="dist/hybrid-codex-aarch64-apple-darwin"
          mkdir -p "$package_dir"
          cp target/aarch64-apple-darwin/release/codex "$package_dir/hybrid-codex"
          cp target/aarch64-apple-darwin/release/codex-code-mode-host "$package_dir/codex-code-mode-host"
          chmod 0755 "$package_dir/hybrid-codex" "$package_dir/codex-code-mode-host"
          "$package_dir/hybrid-codex" --version
          jq -n \
            --arg release_tag "$RELEASE_TAG" \
            --arg upstream_tag "$UPSTREAM_TAG" \
            --arg source_commit "$GITHUB_SHA" \
            --arg target "aarch64-apple-darwin" \
            '{release_tag: $release_tag, upstream_tag: $upstream_tag, source_commit: $source_commit, target: $target}' \
            > "$package_dir/manifest.json"
          archive="dist/hybrid-codex-aarch64-apple-darwin.tar.gz"
          tar -C "$package_dir" -czf "$archive" .
          (
            cd dist
            shasum -a 256 "$(basename "$archive")" > "$(basename "${archive}.sha256")"
          )
      - name: Upload bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hybrid-codex-aarch64-apple-darwin
          path: |
            codex-rs/dist/hybrid-codex-aarch64-apple-darwin.tar.gz
            codex-rs/dist/hybrid-codex-aarch64-apple-darwin.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish hybrid release
    needs: build
    if: ${{ inputs.release_tag != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hybrid-codex-aarch64-apple-darwin
          path: release-assets
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes "基于 openai/codex ${UPSTREAM_TAG} 的个人补丁构建。仅增加 MultiAgentV2 可选明文跨 Provider 投递能力；默认仍为 encrypted。macOS 二进制未使用 OpenAI 官方签名，请通过随附 SHA-256 文件校验。"
